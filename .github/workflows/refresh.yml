name: Refresh Quant Lab 2 research
on:
  schedule:
    - cron: '0 6 * * 1-6'  # after the entire previous ET calendar day has closed
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quant-lab-2-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - name: Refresh prices (preserve prior data on individual failures)
        id: prices
        continue-on-error: true
        run: python run_live_update.py
      - name: Refresh consumed COT table
        id: cot
        continue-on-error: true
        run: python run_refresh_cot.py
      - name: Rebuild and verify, including degraded feed status
        run: |
          python run_quant_lab2.py --record-snapshot
          python verify_quant_lab2.py
      - name: Commit current research report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/data.json data/live data/external/cot_weekly.csv research/live_feed.json research/cot_feed.json research/forward_snapshots
          if ! git diff --staged --quiet; then
            git commit -m 'chore: refresh Quant Lab 2 research report'
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Surface source failures
        if: steps.prices.outcome == 'failure' || steps.cot.outcome == 'failure'
        run: |
          echo 'At least one source failed validation. The dashboard records degraded status; inspect its feed details.'
          exit 1

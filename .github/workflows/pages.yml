name: Deploy GitHub Pages
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh Quant Lab 2 research']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Check report before publication
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('docs/data.json').read_text())
          assert d['schema_version'] == 2
          assert len(d['positions']) == 7
          assert all(c['passed'] for c in d['checks'] if not c.get('operational'))
          assert Path('docs/index.html').exists()
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
